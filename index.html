<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Будівництво</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #161616;
            --accent: #ffcc00;
            --accent-hover: #e6b800;
            --text: #e0e0e0;
            --border: #333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 {
            color: var(--accent);
            margin: 0;
            text-transform: uppercase;
            font-size: 1.5rem;
        }
        .admin-square-btn {
            width: 30px;
            height: 30px;
            background-color: var(--accent);
            border: none;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        .admin-square-btn:hover {
            background-color: var(--accent-hover);
            transform: scale(1.05);
        }
        .btn {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: var(--accent-hover);
        }
        .section {
            background: var(--panel-bg);
            border-left: 4px solid var(--accent);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: var(--accent);
            font-size: 0.9rem;
        }
        select, input {
            width: 100%;
            padding: 10px;
            background: #0d0d0d;
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            box-sizing: border-box;
        }
        input[type="file"] {
            padding: 6px;
            cursor: pointer;
        }
        .player-container {
            position: relative;
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .player-container video, .player-container iframe {
            width: 100%;
            max-height: 70vh;
            min-height: 400px;
            border: none;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--accent);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            background: none;
            border: none;
            color: var(--accent);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .admin-form-group {
            margin-bottom: 15px;
        }
        .admin-section-title {
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .empty-notice {
            text-align: center;
            color: #777;
            padding: 40px;
        }
        #uploadProgress {
            margin-top: 10px;
            color: var(--accent);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Будівництво</h1>
        <button class="admin-square-btn" onclick="openAdminPanel()" title="Адмін-панель"></button>
    </header>

    <main>
        <div class="section">
            <div class="controls-grid">
                <div>
                    <label for="seriesSelect">Серіал:</label>
                    <select id="seriesSelect" onchange="updateSeasons()"></select>
                </div>
                <div>
                    <label for="seasonSelect">Сезон:</label>
                    <select id="seasonSelect" onchange="updateEpisodes()"></select>
                </div>
                <div>
                    <label for="episodeSelect">Серія:</label>
                    <select id="episodeSelect" onchange="playEpisode()"></select>
                </div>
            </div>

            <div id="playerWrapper">
                <div class="empty-notice" id="emptyNotice">Контенту немає. Натисніть жовтий квадрат для додавання!</div>
                <div class="player-container" id="playerBox" style="display: none;">
                    <div id="videoSlot" style="width: 100%;"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Адмін-панель -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeAdminPanel()">&times;</button>
            <h2>Адмін-панель</h2>
            
            <div id="authBox">
                <div class="admin-form-group">
                    <label>Введіть пароль:</label>
                    <input type="password" id="adminPassword" placeholder="Пароль...">
                </div>
                <button class="btn" onclick="checkPassword()">Увійти</button>
            </div>

            <div id="adminPanelContent" style="display: none;">
                <div class="admin-section-title">1. Створити серіал</div>
                <div class="admin-form-group">
                    <input type="text" id="newSeriesName" placeholder="Назва серіалу...">
                </div>
                <button class="btn" onclick="addSeries()">Створити</button>

                <div class="admin-section-title">2. Додати сезон</div>
                <div class="admin-form-group">
                    <label>Виберіть серіал:</label>
                    <select id="adminSeriesSelect"></select>
                </div>
                <div class="admin-form-group">
                    <input type="text" id="newSeasonName" placeholder="Назва сезону...">
                </div>
                <button class="btn" onclick="addSeason()">Додати сезон</button>

                <div class="admin-section-title">3. Опублікувати відео у Cloudinary</div>
                <div class="admin-form-group">
                    <label>Виберіть серіал:</label>
                    <select id="adminEpSeriesSelect" onchange="updateAdminSeasons()"></select>
                </div>
                <div class="admin-form-group">
                    <label>Виберіть сезон:</label>
                    <select id="adminEpSeasonSelect"></select>
                </div>
                <div class="admin-form-group">
                    <input type="text" id="newEpName" placeholder="Назва серії...">
                </div>
                <div class="admin-form-group">
                    <label>Виберіть відеофайл з галереї/комп'ютера:</label>
                    <input type="file" id="newEpFile" accept="video/*">
                </div>
                <button class="btn" id="uploadBtn" onclick="uploadToCloudinary()">Завантажити в Cloudinary</button>
                <div id="uploadProgress"></div>
            </div>
        </div>
    </div>

    <script>
        const CLOUD_NAME = "hvlowzwo";
        const UPLOAD_PRESET = "ml_default"; // Запонюєтья з кроку 1

        let db = JSON.parse(localStorage.getItem('building_cloudinary_db')) || [];

        function saveData() {
            localStorage.setItem('building_cloudinary_db', JSON.stringify(db));
            initSelectors();
        }

        function initSelectors() {
            const sSelect = document.getElementById('seriesSelect');
            sSelect.innerHTML = '';

            if (db.length === 0) {
                document.getElementById('emptyNotice').style.display = 'block';
                document.getElementById('playerBox').style.display = 'none';
                return;
            }

            document.getElementById('emptyNotice').style.display = 'none';
            document.getElementById('playerBox').style.display = 'block';

            db.forEach((series, sIndex) => {
                sSelect.appendChild(new Option(series.name, sIndex));
            });
            updateSeasons();
        }

        function updateSeasons() {
            const sIndex = document.getElementById('seriesSelect').value;
            const seaSelect = document.getElementById('seasonSelect');
            seaSelect.innerHTML = '';

            if (sIndex === '' || !db[sIndex] || !db[sIndex].seasons) return;

            db[sIndex].seasons.forEach((season, seaIndex) => {
                seaSelect.appendChild(new Option(season.name, seaIndex));
            });
            updateEpisodes();
        }

        function updateEpisodes() {
            const sIndex = document.getElementById('seriesSelect').value;
            const seaIndex = document.getElementById('seasonSelect').value;
            const epSelect = document.getElementById('episodeSelect');
            epSelect.innerHTML = '';

            if (sIndex === '' || seaIndex === '' || !db[sIndex].seasons[seaIndex]) return;

            db[sIndex].seasons[seaIndex].episodes.forEach((ep, epIndex) => {
                epSelect.appendChild(new Option(ep.name, epIndex));
            });
            playEpisode();
        }

        function playEpisode() {
            const sIndex = document.getElementById('seriesSelect').value;
            const seaIndex = document.getElementById('seasonSelect').value;
            const epIndex = document.getElementById('episodeSelect').value;
            const videoSlot = document.getElementById('videoSlot');

            if (sIndex === '' || seaIndex === '' || epIndex === '') {
                videoSlot.innerHTML = '';
                return;
            }

            let ep = db[sIndex].seasons[seaIndex].episodes[epIndex];
            if (!ep) return;

            videoSlot.innerHTML = `<video src="${ep.url}" controls autoplay style="width:100%; max-height:70vh; border-radius:4px;"></video>`;
        }

        function openAdminPanel() {
            document.getElementById('adminModal').style.display = 'flex';
            document.getElementById('adminPassword').value = '';
            document.getElementById('authBox').style.display = 'block';
            document.getElementById('adminPanelContent').style.display = 'none';
            document.getElementById('uploadProgress').innerText = '';
        }

        function closeAdminPanel() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function checkPassword() {
            if (document.getElementById('adminPassword').value === '12345678') {
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('adminPanelContent').style.display = 'block';
                initAdminSelectors();
            } else {
                alert('Невірний пароль!');
            }
        }

        function initAdminSelectors() {
            const adminSeries = document.getElementById('adminSeriesSelect');
            const adminEpSeries = document.getElementById('adminEpSeriesSelect');
            adminSeries.innerHTML = '';
            adminEpSeries.innerHTML = '';

            if (db.length === 0) {
                adminSeries.innerHTML = '<option value="">Спершу створіть серіал</option>';
                adminEpSeries.innerHTML = '<option value="">Немає серіалів</option>';
                return;
            }

            db.forEach((series, index) => {
                adminSeries.appendChild(new Option(series.name, index));
                adminEpSeries.appendChild(new Option(series.name, index));
            });
            updateAdminSeasons();
        }

        function updateAdminSeasons() {
            const sIndex = document.getElementById('adminEpSeriesSelect').value;
            const adminEpSeason = document.getElementById('adminEpSeasonSelect');
            adminEpSeason.innerHTML = '';

            if (sIndex === '' || !db[sIndex] || !db[sIndex].seasons) return;

            db[sIndex].seasons.forEach((season, index) => {
                adminEpSeason.appendChild(new Option(season.name, index));
            });
        }

        function addSeries() {
            const name = document.getElementById('newSeriesName').value.trim();
            if (!name) return alert('Введіть назву серіалу');
            db.push({ name: name, seasons: [] });
            document.getElementById('newSeriesName').value = '';
            saveData();
            initAdminSelectors();
            alert('Серіал створено!');
        }

        function addSeason() {
            const sIndex = document.getElementById('adminSeriesSelect').value;
            const name = document.getElementById('newSeasonName').value.trim();
            if (sIndex === '' || !name) return alert('Заповніть поля');
            db[sIndex].seasons.push({ name: name, episodes: [] });
            document.getElementById('newSeasonName').value = '';
            saveData();
            initAdminSelectors();
            alert('Сезон додано!');
        }

        function uploadToCloudinary() {
            const sIndex = document.getElementById('adminEpSeriesSelect').value;
            const seaIndex = document.getElementById('adminEpSeasonSelect').value;
            const name = document.getElementById('newEpName').value.trim();
            const fileInput = document.getElementById('newEpFile');
            const progress = document.getElementById('uploadProgress');
            const btn = document.getElementById('uploadBtn');

            if (sIndex === '' || seaIndex === '' || !name) return alert('Введіть назву серії');
            if (fileInput.files.length === 0) return alert('Виберіть відеофайл');

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);

            progress.innerText = "Завантаження у хмару Cloudinary... Зачекайте!";
            btn.disabled = true;

            fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                if (data.secure_url) {
                    db[sIndex].seasons[seaIndex].episodes.push({
                        name: name,
                        url: data.secure_url
                    });
                    saveData();
                    progress.innerText = "";
                    document.getElementById('newEpName').value = '';
                    fileInput.value = '';
                    alert('Відео успішно завантажено в хмару та додано на сайт для всіх!');
                    closeAdminPanel();
                } else {
                    alert('Помилка завантаження! Перевірте Upload Preset у Cloudinary.');
                    progress.innerText = "";
                }
            })
            .catch(err => {
                btn.disabled = false;
                progress.innerText = "";
                alert('Сталася помилка з\'єднання.');
                console.error(err);
            });
        }

        window.onload = initSelectors;
    </script>
</body>
</html>
