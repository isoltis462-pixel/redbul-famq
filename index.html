<!-- Блок подачі рапорту -->
<div class="forum-card">
    <div class="forum-card-header">📄 Подача Рапорту на Підвищення</div>
    <p style="color: var(--text-muted); margin-bottom: 15px;">
        Заповніть форму нижче. Натисніть кнопку нижче, щоб переглянути статус перевірки.
    </p>

    <!-- Вбудована Google Форма -->
    <div style="position: relative; overflow: hidden; padding-top: 85%; border-radius: 8px; border: 1px solid var(--border-color);">
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScviiwCOX9ySsDAVYzOlM-ui3aj5EmW5BiXdbOq24plOhl3-w/viewform?embedded=true" 
                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" 
                frameborder="0" marginheight="0" marginwidth="0">Завантаження форми...</iframe>
    </div>
</div>

<!-- Кнопка та прихований блок таблиці -->
<div style="margin-top: 20px;">
    <!-- Кнопка відкриття/закриття -->
    <button id="toggleTableBtn" onclick="toggleReportTable()" style="
        width: 100%;
        padding: 12px 20px;
        background-color: var(--accent-color, #e53935);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.2s ease, transform 0.1s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    ">
        <span>📊 Показати таблицю перевірки рапортів</span>
    </button>

    <!-- Блок з таблицею (початково прихований) -->
    <div id="tableContainer" class="forum-card" style="display: none; margin-top: 15px;">
        <div class="forum-card-header">📊 Таблиця Перевірки Рапортів</div>
        <p style="color: var(--text-muted); margin-bottom: 15px;">
            Тут відображаються статуси розгляду поданих рапортів.
        </p>
        
        <div style="position: relative; overflow: hidden; padding-top: 60%; border-radius: 8px; border: 1px solid var(--border-color);">
            <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vScRLQ4kGFShg5Eq5SLZAnQl231sEFhYrKvC1qmaWxZe2AHDJjhwNRgr-nq4wuELO1gjv1AkggWKuCk/pubhtml?widget=true&amp;headers=false" 
                    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;">Завантаження таблиці...</iframe>
        </div>
    </div>
</div>

<!-- Скрипт для роботи кнопки -->
<script>
function toggleReportTable() {
    const tableContainer = document.getElementById('tableContainer');
    const btn = document.getElementById('toggleTableBtn');
    
    if (tableContainer.style.display === 'none') {
        tableContainer.style.display = 'block';
        btn.querySelector('span').innerText = '❌ Сховати таблицю перевірки';
    } else {
        tableContainer.style.display = 'none';
        btn.querySelector('span').innerText = '📊 Показати таблицю перевірки рапортів';
    }
}
</script>
