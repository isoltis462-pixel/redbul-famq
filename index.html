<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карта Визволення</title>
    
    <!-- Підключаємо Leaflet CSS (для карти) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Меню як на скріншоті */
        .menu-box {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(30, 30, 30, 0.9);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 1000;
            min-width: 140px;
        }

        .menu-title {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 6px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 5px;
            text-align: left;
            font-size: 13px;
            cursor: pointer;
            box-sizing: border-box;
        }

        .btn.active {
            background: #4a5568;
            border-color: #63b3ed;
        }

        .btn-blue {
            border-left: 4px solid #3182ce;
        }

        .btn-red {
            border-left: 4px solid #e53e3e;
        }

        /* Підказка знизу */
        .bottom-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 1000;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Меню вибору -->
    <div class="menu-box">
        <div class="menu-title">Режим малювання</div>
        <button class="btn btn-blue active" id="btnLiberate" onclick="setMode('liberate')">Визволення 🇺🇦</button>
        <button class="btn btn-red" id="btnOccupy" onclick="setMode('occupy')">Окупація 🏴‍☠️</button>
        <button class="btn" onclick="clearLayers()">Очистити все</button>
    </div>

    <!-- Підказка -->
    <div class="bottom-hint">1 палець — малювати лінію | 2 пальці — рухати карту</div>

    <!-- Карта -->
    <div id="map"></div>

    <!-- Підключаємо Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Ініціалізація карти (центрируємо на Олешки/Херсон)
        const map = L.map('map', {
            zoomControl: true,
            touchZoom: true
        }).setView([46.62, 32.72], 12);

        // Додаємо шар карти OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let currentMode = 'liberate'; // 'liberate' або 'occupy'
        let isDrawing = false;
        let drawnPoints = [];
        let tempPolyline = null;

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnLiberate').classList.toggle('active', mode === 'liberate');
            document.getElementById('btnOccupy').classList.toggle('active', mode === 'occupy');
        }

        // Початкова демо-зона (симуляція окупованої території на півдні)
        const demoOccupiedZone = [
            [46.60, 32.65],
            [46.65, 32.70],
            [46.63, 32.80],
            [46.55, 32.78],
            [46.56, 32.66]
        ];
        L.polygon(demoOccupiedZone, {
            color: '#e53e3e',
            fillColor: '#f56565',
            fillOpacity: 0.4,
            weight: 1
        }).addTo(map);

        // Події малювання на карті
        const mapContainer = document.getElementById('map');

        function startDraw(e) {
            // Малюємо, тільки якщо 1 палець або ліва кнопка миші
            if (e.touches && e.touches.length > 1) return;

            isDrawing = true;
            map.dragging.disable(); // Вимикаємо перетягування карти під час малювання

            const latLng = getLatLngFromEvent(e);
            if (latLng) {
                drawnPoints = [latLng];
                tempPolyline = L.polyline(drawnPoints, {
                    color: currentMode === 'liberate' ? '#3182ce' : '#e53e3e',
                    dashArray: '6, 8', // Пунктирна лінія, як на скріншоті
                    weight: 3
                }).addTo(map);
            }
        }

        function moveDraw(e) {
            if (!isDrawing) return;
            if (e.touches && e.touches.length > 1) return;

            const latLng = getLatLngFromEvent(e);
            if (latLng) {
                drawnPoints.push(latLng);
                tempPolyline.setLatLngs(drawnPoints);
            }
        }

        function stopDraw() {
            if (!isDrawing) return;
            isDrawing = false;
            map.dragging.enable(); // Вмикаємо перетягування карти назад

            if (tempPolyline) {
                map.removeLayer(tempPolyline);
            }

            // Якщо намальовано достатньо точок — створюємо зафарбовану зону
            if (drawnPoints.length > 5) {
                const isLiberate = currentMode === 'liberate';
                L.polygon(drawnPoints, {
                    color: isLiberate ? '#3182ce' : '#e53e3e',
                    fillColor: isLiberate ? '#63b3ed' : '#f56565',
                    fillOpacity: 0.5,
                    weight: 2
                }).addTo(map);
            }

            drawnPoints = [];
        }

        function getLatLngFromEvent(e) {
            let clientX, clientY;
            if (e.touches && e.touches[0]) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            const containerPoint = L.point(clientX, clientY);
            return map.containerPointToLatLng(containerPoint);
        }

        // Прив'язка подій до контейнера
        mapContainer.addEventListener('mousedown', startDraw);
        mapContainer.addEventListener('mousemove', moveDraw);
        window.addEventListener('mouseup', stopDraw);

        mapContainer.addEventListener('touchstart', startDraw, { passive: false });
        mapContainer.addEventListener('touchmove', moveDraw, { passive: false });
        window.addEventListener('touchend', stopDraw);

        function clearLayers() {
            map.eachLayer((layer) => {
                if (layer instanceof L.Polygon) {
                    map.removeLayer(layer);
                }
            });
        }
    </script>
</body>
</html>
