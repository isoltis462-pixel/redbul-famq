<!-- Блок із формою без зайвих надписів -->
<div class="forum-card">
    <!-- Вбудована Google Форма -->
    <div style="position: relative; overflow: hidden; padding-top: 85%; border-radius: 8px; border: 1px solid var(--border-color);">
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScviiwCOX9ySsDAVYzOlM-ui3aj5EmW5BiXdbOq24plOhl3-w/viewform?embedded=true" 
                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" 
                frameborder="0" marginheight="0" marginwidth="0">Завантаження форми...</iframe>
    </div>

    <!-- Кнопка відкриття модального вікна -->
    <button onclick="openModal()" style="
        width: 100%;
        margin-top: 15px;
        padding: 14px 20px;
        background: linear-gradient(135deg, #e63946 0%, #b1121f 100%);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3);
        transition: transform 0.2s, background 0.2s;
    " onmouseover="this.style.transform='scale(1.01)'" onmouseout="this.style.transform='scale(1)'">
        📊 Відкрити таблицю перевірки рапортів
    </button>
</div>

<!-- Вспливаюче модальне вікно (Modal Popup) -->
<div id="tableModal" style="
    display: none; 
    position: fixed; 
    z-index: 9999; 
    left: 0; 
    top: 0; 
    width: 100%; 
    height: 100%; 
    background-color: rgba(0, 0, 0, 0.85); 
    backdrop-filter: blur(5px);
    align-items: center;
    justify-content: center;
">
    <div style="
        background-color: #161b22; 
        border: 1px solid #30363d; 
        border-radius: 12px; 
        width: 90%; 
        max-width: 1000px; 
        padding: 20px; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        position: relative;
        animation: modalFadeIn 0.3s ease;
    ">
        <!-- Шапка вікна з кнопкою закриття -->
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 12px; margin-bottom: 15px;">
            <h3 style="margin: 0; color: #fff; font-size: 1.2em; display: flex; align-items: center; gap: 8px;">
                📊 Таблиця Перевірки Рапортів
            </h3>
            <button onclick="closeModal()" style="
                background: rgba(255,255,255,0.1); 
                border: none; 
                color: #fff; 
                font-size: 20px; 
                font-weight: bold; 
                width: 36px; 
                height: 36px; 
                border-radius: 50%; 
                cursor: pointer;
                transition: background 0.2s;
            " onmouseover="this.style.background='#e63946'" onmouseout="this.style.background='rgba(255,255,255,0.1)'">✕</button>
        </div>

        <!-- Таблиця всередині вспливаючого вікна -->
        <div style="position: relative; overflow: hidden; padding-top: 55%; border-radius: 8px; border: 1px solid #30363d;">
            <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vScRLQ4kGFShg5Eq5SLZAnQl231sEFhYrKvC1qmaWxZe2AHDJjhwNRgr-nq4wuELO1gjv1AkggWKuCk/pubhtml?widget=true&amp;headers=false" 
                    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;">Завантаження таблиці...</iframe>
        </div>
    </div>
</div>

<!-- Анімація та скрипт управління вікном -->
<style>
@keyframes modalFadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>

<script>
function openModal() {
    document.getElementById('tableModal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('tableModal').style.display = 'none';
}

// Закриття вікна при кліку поза ним
window.onclick = function(event) {
    const modal = document.getElementById('tableModal');
    if (event.target === modal) {
        modal.style.display = 'none';
    }
}
</script>
