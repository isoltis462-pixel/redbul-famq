<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Будівництво</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #161616;
            --accent: #ffcc00;
            --accent-hover: #e6b800;
            --text: #e0e0e0;
            --border: #333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 {
            color: var(--accent);
            margin: 0;
            text-transform: uppercase;
            font-size: 1.5rem;
        }
        .admin-square-btn {
            width: 30px;
            height: 30px;
            background-color: var(--accent);
            border: none;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        .admin-square-btn:hover {
            background-color: var(--accent-hover);
            transform: scale(1.05);
        }
        .btn {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: var(--accent-hover);
        }
        .section {
            background: var(--panel-bg);
            border-left: 4px solid var(--accent);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: var(--accent);
            font-size: 0.9rem;
        }
        select, input {
            width: 100%;
            padding: 10px;
            background: #0d0d0d;
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            box-sizing: border-box;
        }
        .player-container {
            position: relative;
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .player-container iframe, .player-container video {
            width: 100%;
            max-height: 70vh;
            border: none;
        }
        /* Модальне вікно адмінки */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--accent);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            background: none;
            border: none;
            color: var(--accent);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .admin-form-group {
            margin-bottom: 15px;
        }
        .admin-section-title {
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .empty-notice {
            text-align: center;
            color: #777;
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Будівництво</h1>
        <button class="admin-square-btn" onclick="openAdminPanel()" title="Адмін-панель"></button>
    </header>

    <main>
        <div class="section">
            <div class="controls-grid">
                <div>
                    <label for="seriesSelect">Серіал:</label>
                    <select id="seriesSelect" onchange="updateSeasons()"></select>
                </div>
                <div>
                    <label for="seasonSelect">Сезон:</label>
                    <select id="seasonSelect" onchange="updateEpisodes()"></select>
                </div>
                <div>
                    <label for="episodeSelect">Серія:</label>
                    <select id="episodeSelect" onchange="playEpisode()"></select>
                </div>
            </div>

            <div id="playerWrapper">
                <div class="empty-notice" id="emptyNotice">Немає доступного контенту. Скористайтеся адмін-панеллю!</div>
                <div class="player-container" id="playerBox" style="display: none;">
                    <div id="videoSlot" style="width: 100%;"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Адмін-панель -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeAdminPanel()">&times;</button>
            <h2>Адмін-панель</h2>
            
            <div id="authBox">
                <div class="admin-form-group">
                    <label>Введіть пароль:</label>
                    <input type="password" id="adminPassword" placeholder="Пароль...">
                </div>
                <button class="btn" onclick="checkPassword()">Увійти</button>
            </div>

            <div id="adminPanelContent" style="display: none;">
                <div class="admin-section-title">1. Створити серіал</div>
                <div class="admin-form-group">
                    <input type="text" id="newSeriesName" placeholder="Назва серіалу...">
                </div>
                <button class="btn" onclick="addSeries()">Створити</button>

                <div class="admin-section-title">2. Додати сезон</div>
                <div class="admin-form-group">
                    <label>Виберіть серіал:</label>
                    <select id="adminSeriesSelect"></select>
                </div>
                <div class="admin-form-group">
                    <input type="text" id="newSeasonName" placeholder="Назва сезону...">
                </div>
                <button class="btn" onclick="addSeason()">Додати сезон</button>

                <div class="admin-section-title">3. Додати серію (Cloudinary або YouTube)</div>
                <div class="admin-form-group">
                    <label>Виберіть серіал:</label>
                    <select id="adminEpSeriesSelect" onchange="updateAdminSeasons()"></select>
                </div>
                <div class="admin-form-group">
                    <label>Виберіть сезон:</label>
                    <select id="adminEpSeasonSelect"></select>
                </div>
                <div class="admin-form-group">
                    <input type="text" id="newEpName" placeholder="Назва серії...">
                </div>
                <div class="admin-form-group">
                    <input type="text" id="newEpUrl" placeholder="Посилання на відео (Cloudinary .mp4 або YouTube)...">
                </div>
                <button class="btn" onclick="addEpisode()">Додати серію</button>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('building_cloud_db')) || [];

        function saveData() {
            localStorage.setItem('building_cloud_db', JSON.stringify(db));
            initSelectors();
        }

        function initSelectors() {
            const sSelect = document.getElementById('seriesSelect');
            sSelect.innerHTML = '';

            if (db.length === 0) {
                document.getElementById('emptyNotice').style.display = 'block';
                document.getElementById('playerBox').style.display = 'none';
                return;
            }

            document.getElementById('emptyNotice').style.display = 'none';
            document.getElementById('playerBox').style.display = 'block';

            db.forEach((series, sIndex) => {
                let opt = document.createElement('option');
                opt.value = sIndex;
                opt.textContent = series.name;
                sSelect.appendChild(opt);
            });
            updateSeasons();
        }

        function updateSeasons() {
            const sIndex = document.getElementById('seriesSelect').value;
            const seaSelect = document.getElementById('seasonSelect');
            seaSelect.innerHTML = '';

            if (sIndex === '' || !db[sIndex] || !db[sIndex].seasons) return;

            db[sIndex].seasons.forEach((season, seaIndex) => {
                let opt = document.createElement('option');
                opt.value = seaIndex;
                opt.textContent = season.name;
                seaSelect.appendChild(opt);
            });
            updateEpisodes();
        }

        function updateEpisodes() {
            const sIndex = document.getElementById('seriesSelect').value;
            const seaIndex = document.getElementById('seasonSelect').value;
            const epSelect = document.getElementById('episodeSelect');
            epSelect.innerHTML = '';

            if (sIndex === '' || seaIndex === '' || !db[sIndex].seasons[seaIndex]) return;

            db[sIndex].seasons[seaIndex].episodes.forEach((ep, epIndex) => {
                let opt = document.createElement('option');
                opt.value = epIndex;
                opt.textContent = ep.name;
                epSelect.appendChild(opt);
            });
            playEpisode();
        }

        function playEpisode() {
            const sIndex = document.getElementById('seriesSelect').value;
            const seaIndex = document.getElementById('seasonSelect').value;
            const epIndex = document.getElementById('episodeSelect').value;
            const videoSlot = document.getElementById('videoSlot');

            if (sIndex === '' || seaIndex === '' || epIndex === '') {
                videoSlot.innerHTML = '';
                return;
            }

            let ep = db[sIndex].seasons[seaIndex].episodes[epIndex];
            if (!ep) return;

            let url = ep.url.trim();

            // Перевіряємо, чи це прямий файлове відео з Cloudinary / MP4 чи YouTube
            if (url.endsWith('.mp4') || url.includes('cloudinary.com')) {
                videoSlot.innerHTML = `<video src="${url}" controls autoplay style="width:100%; max-height: 70vh; border-radius: 4px;"></video>`;
            } else if (url.includes('watch?v=') || url.includes('youtu.be/')) {
                let videoId = url.includes('watch?v=') ? url.split('watch?v=')[1].split('&')[0] : url.split('youtu.be/')[1].split('?')[0];
                videoSlot.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" style="width:100%; height:450px;" allowfullscreen></iframe>`;
            } else {
                videoSlot.innerHTML = `<video src="${url}" controls style="width:100%; max-height: 70vh;"></video>`;
            }
        }

        function openAdminPanel() {
            document.getElementById('adminModal').style.display = 'flex';
            document.getElementById('adminPassword').value = '';
            document.getElementById('authBox').style.display = 'block';
            document.getElementById('adminPanelContent').style.display = 'none';
        }

        function closeAdminPanel() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function checkPassword() {
            if (document.getElementById('adminPassword').value === '12345678') {
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('adminPanelContent').style.display = 'block';
                initAdminSelectors();
            } else {
                alert('Невірний пароль!');
            }
        }

        function initAdminSelectors() {
            const adminSeries = document.getElementById('adminSeriesSelect');
            const adminEpSeries = document.getElementById('adminEpSeriesSelect');
            adminSeries.innerHTML = '';
            adminEpSeries.innerHTML = '';

            if (db.length === 0) {
                adminSeries.innerHTML = '<option value="">Спершу створіть серіал</option>';
                adminEpSeries.innerHTML = '<option value="">Немає серіалів</option>';
                return;
            }

            db.forEach((series, index) => {
                adminSeries.appendChild(new Option(series.name, index));
                adminEpSeries.appendChild(new Option(series.name, index));
            });
            updateAdminSeasons();
        }

        function updateAdminSeasons() {
            const sIndex = document.getElementById('adminEpSeriesSelect').value;
            const adminEpSeason = document.getElementById('adminEpSeasonSelect');
            adminEpSeason.innerHTML = '';

            if (sIndex === '' || !db[sIndex] || !db[sIndex].seasons) return;

            db[sIndex].seasons.forEach((season, index) => {
                adminEpSeason.appendChild(new Option(season.name, index));
            });
        }

        function addSeries() {
            const name = document.getElementById('newSeriesName').value.trim();
            if (!name) return alert('Введіть назву серіалу');
            db.push({ name: name, seasons: [] });
            document.getElementById('newSeriesName').value = '';
            saveData();
            initAdminSelectors();
            alert('Серіал створено!');
        }

        function addSeason() {
            const sIndex = document.getElementById('adminSeriesSelect').value;
            const name = document.getElementById('newSeasonName').value.trim();
            if (sIndex === '' || !name) return alert('Заповніть поля');
            db[sIndex].seasons.push({ name: name, episodes: [] });
            document.getElementById('newSeasonName').value = '';
            saveData();
            initAdminSelectors();
            alert('Сезон додано!');
        }

        function addEpisode() {
            const sIndex = document.getElementById('adminEpSeriesSelect').value;
            const seaIndex = document.getElementById('adminEpSeasonSelect').value;
            const name = document.getElementById('newEpName').value.trim();
            const url = document.getElementById('newEpUrl').value.trim();

            if (sIndex === '' || seaIndex === '' || !name || !url) return alert('Заповніть всі поля');
            
            db[sIndex].seasons[seaIndex].episodes.push({ name: name, url: url });
            document.getElementById('newEpName').value = '';
            document.getElementById('newEpUrl').value = '';
            saveData();
            alert('Серію успішно додано!');
        }

        window.onload = function() {
            initSelectors();
        };
    </script>
</body>
</html>
