<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карта Освобождения (DeepState Style)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
            /* Отключаем стандартный курсор текста */
            cursor: crosshair; 
        }

        .menu-box {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(30, 30, 30, 0.9);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 1000;
            min-width: 150px;
        }

        .menu-title {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 10px;
            font-weight: bold;
            text-align: center;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 5px;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            box-sizing: border-box;
            transition: 0.2s;
        }

        .btn.active {
            background: #4a5568;
        }

        .btn-green {
            border-left: 5px solid #22c55e;
        }
        .btn-green.active {
            border-color: #4ade80;
            background: rgba(34, 197, 94, 0.2);
        }

        .btn-red {
            border-left: 5px solid #ef4444;
        }
        .btn-red.active {
            border-color: #f87171;
            background: rgba(239, 68, 68, 0.2);
        }

        .bottom-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #ccc;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 1000;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="menu-box">
        <div class="menu-title">МЕНЮ</div>
        <button class="btn btn-green active" id="btnLiberate" onclick="setMode('liberate')">Освобождение 🇺🇦</button>
        <button class="btn btn-red" id="btnOccupy" onclick="setMode('occupy')">Оккупация 🏴‍☠️</button>
        <button class="btn" style="text-align: center; margin-top: 15px;" onclick="clearLayers()">Отменить всё</button>
    </div>

    <div class="bottom-hint">ЛКМ / 1 палец — рисовать &nbsp;|&nbsp; ПКМ / 2 пальца — двигать карту</div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Отключаем стандартное перетаскивание Leaflet, чтобы сделать свое (ЛКМ - рисовать, ПКМ - двигать)
        const map = L.map('map', {
            zoomControl: true,
            dragging: false,      // Отключаем стандартный драг
            touchZoom: true,      // Оставляем зум щипком
            doubleClickZoom: false
        }).setView([48.3794, 31.1656], 6); // Центр Украины

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Реальная зона оккупации (приблизительные координаты фронта и Крыма)
        const realOccupiedZone = [
            [46.5, 31.5], [46.6, 32.6], [47.0, 33.5], [47.4, 35.5], 
            [47.8, 37.2], [48.0, 37.7], [48.6, 37.9], [48.8, 38.2], 
            [49.0, 38.1], [49.6, 37.8], [49.9, 38.0], [50.2, 38.2], 
            [49.8, 39.8], [48.2, 39.9], [47.1, 38.3], [46.7, 36.8], 
            [45.3, 36.4], [44.4, 34.0], [45.4, 32.5], [46.1, 32.3]
        ];
        
        L.polygon(realOccupiedZone, {
            color: '#ef4444',
            fillColor: '#ef4444',
            fillOpacity: 0.35,
            weight: 1,
            interactive: false
        }).addTo(map);

        let currentMode = 'liberate';
        let isDrawing = false;
        let drawnPoints = [];
        let tempPolyline = null;
        let mapContainer = document.getElementById('map');

        // Цвета
        const COLOR_LIBERATE = '#22c55e'; // Зеленый
        const COLOR_OCCUPY = '#ef4444';   // Красный

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnLiberate').classList.toggle('active', mode === 'liberate');
            document.getElementById('btnOccupy').classList.toggle('active', mode === 'occupy');
        }

        function getLatLng(x, y) {
            const rect = mapContainer.getBoundingClientRect();
            return map.containerPointToLatLng(L.point(x - rect.left, y - rect.top));
        }

        // --- ЛОГИКА РИСОВАНИЯ ---
        function startDraw(x, y) {
            isDrawing = true;
            drawnPoints = [getLatLng(x, y)];
            tempPolyline = L.polyline(drawnPoints, {
                color: currentMode === 'liberate' ? COLOR_LIBERATE : COLOR_OCCUPY,
                dashArray: '5, 8',
                weight: 3
            }).addTo(map);
        }

        function moveDraw(x, y) {
            if (!isDrawing) return;
            drawnPoints.push(getLatLng(x, y));
            tempPolyline.setLatLngs(drawnPoints);
        }

        function stopDraw() {
            if (!isDrawing) return;
            isDrawing = false;

            if (tempPolyline) map.removeLayer(tempPolyline);

            if (drawnPoints.length > 5) {
                const color = currentMode === 'liberate' ? COLOR_LIBERATE : COLOR_OCCUPY;
                L.polygon(drawnPoints, {
                    color: color,
                    fillColor: color,
                    fillOpacity: 0.5,
                    weight: 2
                }).addTo(map);
            }
            drawnPoints = [];
        }

        // --- УПРАВЛЕНИЕ МЫШЬЮ (ПК) ---
        let isRightMouseDown = false;
        let lastMousePos = null;

        // Отключаем контекстное меню при ПКМ
        mapContainer.addEventListener('contextmenu', e => e.preventDefault());

        mapContainer.addEventListener('mousedown', function(e) {
            if (e.button === 2) { 
                // Правая кнопка мыши - Двигать карту
                isRightMouseDown = true;
                lastMousePos = { x: e.clientX, y: e.clientY };
            } else if (e.button === 0) { 
                // Левая кнопка мыши - Рисовать
                startDraw(e.clientX, e.clientY);
            }
        });

        window.addEventListener('mousemove', function(e) {
            if (isRightMouseDown) {
                // Перемещение карты
                const dx = e.clientX - lastMousePos.x;
                const dy = e.clientY - lastMousePos.y;
                map.panBy([-dx, -dy], { animate: false });
                lastMousePos = { x: e.clientX, y: e.clientY };
            } else if (isDrawing) {
                moveDraw(e.clientX, e.clientY);
            }
        });

        window.addEventListener('mouseup', function(e) {
            if (e.button === 2) isRightMouseDown = false;
            if (e.button === 0) stopDraw();
        });

        // --- УПРАВЛЕНИЕ СЕНСОРОМ (ТЕЛЕФОН) ---
        let isTwoFingerPan = false;
        let lastTouchPos = null;

        mapContainer.addEventListener('touchstart', function(e) {
            if (e.touches.length === 2) {
                // 2 пальца - Двигать карту
                isTwoFingerPan = true;
                if (isDrawing) stopDraw(); // Прерываем рисование, если начали двигать
                
                lastTouchPos = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                };
            } else if (e.touches.length === 1 && !isTwoFingerPan) {
                // 1 палец - Рисовать
                e.preventDefault(); // Блокируем стандартный скролл экрана
                startDraw(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        mapContainer.addEventListener('touchmove', function(e) {
            if (e.touches.length === 2 && isTwoFingerPan) {
                e.preventDefault();
                const currentX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const currentY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                
                const dx = currentX - lastTouchPos.x;
                const dy = currentY - lastTouchPos.y;
                
                map.panBy([-dx, -dy], { animate: false });
                lastTouchPos = { x: currentX, y: currentY };
            } else if (e.touches.length === 1 && isDrawing) {
                e.preventDefault();
                moveDraw(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        window.addEventListener('touchend', function(e) {
            if (e.touches.length < 2) isTwoFingerPan = false;
            if (e.touches.length === 0) stopDraw();
        });

        // --- ОЧИСТКА ---
        function clearLayers() {
            map.eachLayer((layer) => {
                // Удаляем только нарисованные полигоны (оставляем базовую карту и основную зону оккупации)
                if (layer instanceof L.Polygon && layer.options.interactive !== false) {
                    map.removeLayer(layer);
                }
            });
        }
    </script>
</body>
</html>
