<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кино-Вселенная (YouTube Player)</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #161616;
            --accent: #ffcc00;
            --accent-hover: #e6b800;
            --text: #e0e0e0;
            --border: #333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 {
            color: var(--accent);
            margin: 0;
            text-transform: uppercase;
            font-size: 1.5rem;
        }
        .btn {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: var(--accent-hover);
        }
        .section {
            background: var(--panel-bg);
            border-left: 4px solid var(--accent);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: var(--accent);
            font-size: 0.9rem;
        }
        select, input {
            width: 100%;
            padding: 10px;
            background: #0d0d0d;
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            box-sizing: border-box;
        }
        .player-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Соотношение сторон 16:9 */
            background: #000;
            border: 1px solid var(--border);
            margin-top: 15px;
        }
        .player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Модальное окно админки */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--accent);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            background: none;
            border: none;
            color: var(--accent);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .admin-form-group {
            margin-bottom: 15px;
        }
        .admin-section-title {
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .empty-notice {
            text-align: center;
            color: #777;
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Кино-Вселенная</h1>
        <button class="btn" onclick="openAdminPanel()">Админ-панель</button>
    </header>

    <!-- Основной блок просмотра -->
    <main>
        <div class="section">
            <div class="controls-grid">
                <div>
                    <label for="seriesSelect">Сериал:</label>
                    <select id="seriesSelect" onchange="updateSeasons()"></select>
                </div>
                <div>
                    <label for="seasonSelect">Сезон:</label>
                    <select id="seasonSelect" onchange="updateEpisodes()"></select>
                </div>
                <div>
                    <label for="episodeSelect">Серия:</label>
                    <select id="episodeSelect" onchange="playEpisode()"></select>
                </div>
            </div>

            <div id="playerWrapper">
                <div class="empty-notice" id="emptyNotice">Нет доступных видео. Добавьте сериал через админ-панель.</div>
                <div class="player-container" id="playerBox" style="display: none;">
                    <div id="videoSlot"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Модальное окно админ-панели -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeAdminPanel()">&times;</button>
            <h2>Админ-панель</h2>
            
            <!-- Форма авторизации -->
            <div id="authBox">
                <div class="admin-form-group">
                    <label>Введите пароль:</label>
                    <input type="password" id="adminPassword" placeholder="Пароль...">
                </div>
                <button class="btn" onclick="checkPassword()">Войти</button>
            </div>

            <!-- Интерфейс управления (скрыт до ввода пароля) -->
            <div id="adminPanelContent" style="display: none;">
                
                <div class="admin-section-title">1. Добавить новый сериал</div>
                <div class="admin-form-group">
                    <input type="text" id="newSeriesName" placeholder="Название сериала...">
                </div>
                <button class="btn" onclick="addSeries()">Создать сериал</button>

                <div class="admin-section-title">2. Добавить сезон</div>
                <div class="admin-form-group">
                    <label>Выберите сериал:</label>
                    <select id="adminSeriesSelect"></select>
                </div>
                <div class="admin-form-group">
                    <input type="text" id="newSeasonName" placeholder="Название сезона (например: Сезон 1)...">
                </div>
                <button class="btn" onclick="addSeason()">Добавить сезон</button>

                <div class="admin-section-title">3. Добавить серию</div>
                <div class="admin-form-group">
                    <label>Выберите сериал:</label>
                    <select id="adminEpSeriesSelect" onchange="updateAdminSeasons()"></select>
                </div>
                <div class="admin-form-group">
                    <label>Выберите сезон:</label>
                    <select id="adminEpSeasonSelect"></select>
                </div>
                <div class="admin-form-group">
                    <input type="text" id="newEpName" placeholder="Название серии (например: Серия 1)...">
                </div>
                <div class="admin-form-group">
                    <input type="text" id="newEpUrl" placeholder="Ссылка с YouTube (например: https://youtu.be/...)">
                </div>
                <button class="btn" onclick="addEpisode()">Добавить серию</button>
            </div>
        </div>
    </div>

    <script>
        // Данные по умолчанию или из памяти браузера
        let db = JSON.parse(localStorage.getItem('kino_db_yt')) || [
            {
                name: "Стройка (Пример)",
                seasons: [
                    {
                        name: "Сезон 1",
                        episodes: [
                            { name: "Эпизод 1", url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ" }
                        ]
                    }
                ]
            }
        ];

        function saveData() {
            localStorage.setItem('kino_db_yt', JSON.stringify(db));
            initSelectors();
        }

        function initSelectors() {
            const sSelect = document.getElementById('seriesSelect');
            sSelect.innerHTML = '';

            if (db.length === 0) {
                document.getElementById('emptyNotice').style.display = 'block';
                document.getElementById('playerBox').style.display = 'none';
                return;
            }

            document.getElementById('emptyNotice').style.display = 'none';
            document.getElementById('playerBox').style.display = 'block';

            db.forEach((series, sIndex) => {
                let opt = document.createElement('option');
                opt.value = sIndex;
                opt.textContent = series.name;
                sSelect.appendChild(opt);
            });
            updateSeasons();
        }

        function updateSeasons() {
            const sIndex = document.getElementById('seriesSelect').value;
            const seaSelect = document.getElementById('seasonSelect');
            seaSelect.innerHTML = '';

            if (sIndex === '' || !db[sIndex] || !db[sIndex].seasons) return;

            db[sIndex].seasons.forEach((season, seaIndex) => {
                let opt = document.createElement('option');
                opt.value = seaIndex;
                opt.textContent = season.name;
                seaSelect.appendChild(opt);
            });
            updateEpisodes();
        }

        function updateEpisodes() {
            const sIndex = document.getElementById('seriesSelect').value;
            const seaIndex = document.getElementById('seasonSelect').value;
            const epSelect = document.getElementById('episodeSelect');
            epSelect.innerHTML = '';

            if (sIndex === '' || seaIndex === '' || !db[sIndex].seasons[seaIndex]) return;

            db[sIndex].seasons[seaIndex].episodes.forEach((ep, epIndex) => {
                let opt = document.createElement('option');
                opt.value = epIndex;
                opt.textContent = ep.name;
                epSelect.appendChild(opt);
            });
            playEpisode();
        }

        // Автоконвертация ссылки YouTube в iframe и запуск
        function playEpisode() {
            const sIndex = document.getElementById('seriesSelect').value;
            const seaIndex = document.getElementById('seasonSelect').value;
            const epIndex = document.getElementById('episodeSelect').value;
            const videoSlot = document.getElementById('videoSlot');

            if (sIndex === '' || seaIndex === '' || epIndex === '') return;

            let ep = db[sIndex].seasons[seaIndex].episodes[epIndex];
            if (!ep) return;

            let url = ep.url.trim();
            let embedUrl = "";

            if (url.includes('watch?v=')) {
                let videoId = url.split('watch?v=')[1].split('&')[0];
                embedUrl = `https://www.youtube.com/embed/${videoId}`;
            } else if (url.includes('youtu.be/')) {
                let videoId = url.split('youtu.be/')[1].split('?')[0];
                embedUrl = `https://www.youtube.com/embed/${videoId}`;
            } else {
                embedUrl = url; // Если вдруг вставлена прямая embed ссылка
            }

            videoSlot.innerHTML = `<iframe src="${embedUrl}" allowfullscreen></iframe>`;
        }

        // Управление админ-панелью
        function openAdminPanel() {
            document.getElementById('adminModal').style.display = 'flex';
            document.getElementById('adminPassword').value = '';
            document.getElementById('authBox').style.display = 'block';
            document.getElementById('adminPanelContent').style.display = 'none';
        }

        function closeAdminPanel() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function checkPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === '12345678') {
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('adminPanelContent').style.display = 'block';
                initAdminSelectors();
            } else {
                alert('Неверный пароль! (Подсказка: 12345678)');
            }
        }

        function initAdminSelectors() {
            const adminSeries = document.getElementById('adminSeriesSelect');
            const adminEpSeries = document.getElementById('adminEpSeriesSelect');
            adminSeries.innerHTML = '';
            adminEpSeries.innerHTML = '';

            db.forEach((series, index) => {
                adminSeries.appendChild(new Option(series.name, index));
                adminEpSeries.appendChild(new Option(series.name, index));
            });
            updateAdminSeasons();
        }

        function updateAdminSeasons() {
            const sIndex = document.getElementById('adminEpSeriesSelect').value;
            const adminEpSeason = document.getElementById('adminEpSeasonSelect');
            adminEpSeason.innerHTML = '';

            if (sIndex === '' || !db[sIndex]) return;

            db[sIndex].seasons.forEach((season, index) => {
                adminEpSeason.appendChild(new Option(season.name, index));
            });
        }

        // Добавление данных
        function addSeries() {
            const name = document.getElementById('newSeriesName').value.trim();
            if (!name) return alert('Введите название сериала');
            db.push({ name: name, seasons: [] });
            document.getElementById('newSeriesName').value = '';
            saveData();
            initAdminSelectors();
            alert('Сериал успешно создан!');
        }

        function addSeason() {
            const sIndex = document.getElementById('adminSeriesSelect').value;
            const name = document.getElementById('newSeasonName').value.trim();
            if (sIndex === '' || !name) return alert('Заполните все поля');
            db[sIndex].seasons.push({ name: name, episodes: [] });
            document.getElementById('newSeasonName').value = '';
            saveData();
            initAdminSelectors();
            alert('Сезон успешно добавлен!');
        }

        function addEpisode() {
            const sIndex = document.getElementById('adminEpSeriesSelect').value;
            const seaIndex = document.getElementById('adminEpSeasonSelect').value;
            const name = document.getElementById('newEpName').value.trim();
            const url = document.getElementById('newEpUrl').value.trim();

            if (sIndex === '' || seaIndex === '' || !name || !url) return alert('Заполните все поля серии');
            
            db[sIndex].seasons[seaIndex].episodes.push({ name: name, url: url });
            document.getElementById('newEpName').value = '';
            document.getElementById('newEpUrl').value = '';
            saveData();
            alert('Серия успешно добавлена!');
        }

        window.onload = function() {
            initSelectors();
        };
    </script>
</body>
</html>
