<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Будівництво (Кино-Вселенная)</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #161616;
            --accent: #ffcc00;
            --accent-hover: #e6b800;
            --text: #e0e0e0;
            --border: #333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 {
            color: var(--accent);
            margin: 0;
            text-transform: uppercase;
            font-size: 1.5rem;
        }
        .admin-square-btn {
            width: 30px;
            height: 30px;
            background-color: var(--accent);
            border: none;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        .admin-square-btn:hover {
            background-color: var(--accent-hover);
            transform: scale(1.05);
        }
        .btn {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: var(--accent-hover);
        }
        .section {
            background: var(--panel-bg);
            border-left: 4px solid var(--accent);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: var(--accent);
            font-size: 0.9rem;
        }
        select, input, textarea {
            width: 100%;
            padding: 10px;
            background: #0d0d0d;
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .player-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            background: #000;
            border: 1px solid var(--border);
            margin-top: 15px;
        }
        .player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Блок для интерактивного кода/истории */
        .interactive-container {
            background: #0d0d0d;
            border: 1px solid var(--border);
            padding: 25px;
            margin-top: 15px;
            border-radius: 4px;
            min-height: 250px;
        }
        /* Модальное окно админки */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--accent);
            padding: 30px;
            width: 100%;
            max-width: 550px;
            box-sizing: border-box;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            background: none;
            border: none;
            color: var(--accent);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .admin-form-group {
            margin-bottom: 15px;
        }
        .admin-section-title {
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .empty-notice {
            text-align: center;
            color: #777;
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Будівництво</h1>
        <button class="admin-square-btn" onclick="openAdminPanel()" title="Админ-панель"></button>
    </header>

    <!-- Основной блок просмотра -->
    <main>
        <div class="section">
            <div class="controls-grid">
                <div>
                    <label for="seriesSelect">Серіал:</label>
                    <select id="seriesSelect" onchange="updateSeasons()"></select>
                </div>
                <div>
                    <label for="seasonSelect">Сезон:</label>
                    <select id="seasonSelect" onchange="updateEpisodes()"></select>
                </div>
                <div>
                    <label for="episodeSelect">Серія:</label>
                    <select id="episodeSelect" onchange="playEpisode()"></select>
                </div>
            </div>

            <div id="playerWrapper">
                <div class="empty-notice" id="emptyNotice">Немає доступного контенту. Натисніть на жовтий квадрат у правому верхньому кутку (пароль: 12345678), щоб додати серіал чи інтерактив!</div>
                
                <!-- Слот для YouTube видео -->
                <div class="player-container" id="playerBox" style="display: none;">
                    <div id="videoSlot"></div>
                </div>

                <!-- Слот для интерактивного кода / текста / HTML -->
                <div class="interactive-container" id="interactiveBox" style="display: none;">
                    <div id="interactiveSlot"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Модальное окно админ-панели -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeAdminPanel()">&times;</button>
            <h2>Адмін-панель</h2>
            
            <!-- Авторизация -->
            <div id="authBox">
                <div class="admin-form-group">
                    <label>Введіть пароль:</label>
                    <input type="password" id="adminPassword" placeholder="Пароль...">
                </div>
                <button class="btn" onclick="checkPassword()">Увійти</button>
            </div>

            <!-- Управление -->
            <div id="adminPanelContent" style="display: none;">
                
                <div class="admin-section-title">1. Створити серіал</div>
                <div class="admin-form-group">
                    <input type="text" id="newSeriesName" placeholder="Назва серіалу...">
                </div>
                <button class="btn" onclick="addSeries()">Створити</button>

                <div class="admin-section-title">2. Додати сезон</div>
                <div class="admin-form-group">
                    <label>Виберіть серіал:</label>
                    <select id="adminSeriesSelect"></select>
                </div>
                <div class="admin-form-group">
                    <input type="text" id="newSeasonName" placeholder="Назва сезону (напр: Сезон 1)...">
                </div>
                <button class="btn" onclick="addSeason()">Додати сезон</button>

                <div class="admin-section-title">3. Додати серію / інтерактив</div>
                <div class="admin-form-group">
                    <label>Виберіть серіал:</label>
                    <select id="adminEpSeriesSelect" onchange="updateAdminSeasons()"></select>
                </div>
                <div class="admin-form-group">
                    <label>Виберіть сезон:</label>
                    <select id="adminEpSeasonSelect"></select>
                </div>
                <div class="admin-form-group">
                    <input type="text" id="newEpName" placeholder="Назва серії (напр: Серія 1)...">
                </div>
                <div class="admin-form-group">
                    <label>Тип контенту:</label>
                    <select id="newEpType" onchange="toggleContentType()">
                        <option value="youtube">YouTube Відео</option>
                        <option value="interactive">Інтерактивний код / HTML / Текст</option>
                    </select>
                </div>

                <!-- Поле для YouTube -->
                <div class="admin-form-group" id="youtubeInputGroup">
                    <input type="text" id="newEpUrl" placeholder="Посилання з YouTube (напр: https://youtu.be/...)">
                </div>

                <!-- Поле для интерактивного кода -->
                <div class="admin-form-group" id="interactiveInputGroup" style="display: none;">
                    <textarea id="newEpContent" placeholder="Введіть HTML код, текст або інтерактивний скрипт для цієї серії..."></textarea>
                </div>

                <button class="btn" onclick="addEpisode()">Додати контент</button>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('building_db')) || [];

        function saveData() {
            localStorage.setItem('building_db', JSON.stringify(db));
            initSelectors();
        }

        function initSelectors() {
            const sSelect = document.getElementById('seriesSelect');
            sSelect.innerHTML = '';

            if (db.length === 0) {
                document.getElementById('emptyNotice').style.display = 'block';
                document.getElementById('playerBox').style.display = 'none';
                document.getElementById('interactiveBox').style.display = 'none';
                return;
            }

            document.getElementById('emptyNotice').style.display = 'none';

            db.forEach((series, sIndex) => {
                let opt = document.createElement('option');
                opt.value = sIndex;
                opt.textContent = series.name;
                sSelect.appendChild(opt);
            });
            updateSeasons();
        }

        function updateSeasons() {
            const sIndex = document.getElementById('seriesSelect').value;
            const seaSelect = document.getElementById('seasonSelect');
            seaSelect.innerHTML = '';

            if (sIndex === '' || !db[sIndex] || !db[sIndex].seasons) return;

            db[sIndex].seasons.forEach((season, seaIndex) => {
                let opt = document.createElement('option');
                opt.value = seaIndex;
                opt.textContent = season.name;
                seaSelect.appendChild(opt);
            });
            updateEpisodes();
        }

        function updateEpisodes() {
            const sIndex = document.getElementById('seriesSelect').value;
            const seaIndex = document.getElementById('seasonSelect').value;
            const epSelect = document.getElementById('episodeSelect');
            epSelect.innerHTML = '';

            if (sIndex === '' || seaIndex === '' || !db[sIndex].seasons[seaIndex]) return;

            db[sIndex].seasons[seaIndex].episodes.forEach((ep, epIndex) => {
                let opt = document.createElement('option');
                opt.value = epIndex;
                opt.textContent = ep.name;
                epSelect.appendChild(opt);
            });
            playEpisode();
        }

        function playEpisode() {
            const sIndex = document.getElementById('seriesSelect').value;
            const seaIndex = document.getElementById('seasonSelect').value;
            const epIndex = document.getElementById('episodeSelect').value;
            
            const playerBox = document.getElementById('playerBox');
            const interactiveBox = document.getElementById('interactiveBox');
            const videoSlot = document.getElementById('videoSlot');
            const interactiveSlot = document.getElementById('interactiveSlot');

            if (sIndex === '' || seaIndex === '' || epIndex === '') {
                playerBox.style.display = 'none';
                interactiveBox.style.display = 'none';
                return;
            }

            let ep = db[sIndex].seasons[seaIndex].episodes[epIndex];
            if (!ep) return;

            if (ep.type === 'interactive') {
                playerBox.style.display = 'none';
                interactiveBox.style.display = 'block';
                interactiveSlot.innerHTML = ep.content; // Відображаємо кастомний HTML/код/текст
            } else {
                interactiveBox.style.display = 'none';
                playerBox.style.display = 'block';

                let url = ep.url.trim();
                let embedUrl = "";

                if (url.includes('watch?v=')) {
                    let videoId = url.split('watch?v=')[1].split('&')[0];
                    embedUrl = `https://www.youtube.com/embed/${videoId}`;
                } else if (url.includes('youtu.be/')) {
                    let videoId = url.split('youtu.be/')[1].split('?')[0];
                    embedUrl = `https://www.youtube.com/embed/${videoId}`;
                } else {
                    embedUrl = url;
                }

                videoSlot.innerHTML = `<iframe src="${embedUrl}" allowfullscreen></iframe>`;
            }
        }

        function toggleContentType() {
            const type = document.getElementById('newEpType').value;
            if (type === 'interactive') {
                document.getElementById('youtubeInputGroup').style.display = 'none';
                document.getElementById('interactiveInputGroup').style.display = 'block';
            } else {
                document.getElementById('youtubeInputGroup').style.display = 'block';
                document.getElementById('interactiveInputGroup').style.display = 'none';
            }
        }

        function openAdminPanel() {
            document.getElementById('adminModal').style.display = 'flex';
            document.getElementById('adminPassword').value = '';
            document.getElementById('authBox').style.display = 'block';
            document.getElementById('adminPanelContent').style.display = 'none';
        }

        function closeAdminPanel() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function checkPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === '12345678') {
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('adminPanelContent').style.display = 'block';
                initAdminSelectors();
            } else {
                alert('Невірний пароль!');
            }
        }

        function initAdminSelectors() {
            const adminSeries = document.getElementById('adminSeriesSelect');
            const adminEpSeries = document.getElementById('adminEpSeriesSelect');
            adminSeries.innerHTML = '';
            adminEpSeries.innerHTML = '';

            if (db.length === 0) {
                adminSeries.innerHTML = '<option value="">Спершу створіть серіал</option>';
                adminEpSeries.innerHTML = '<option value="">Немає серіалів</option>';
                return;
            }

            db.forEach((series, index) => {
                adminSeries.appendChild(new Option(series.name, index));
                adminEpSeries.appendChild(new Option(series.name, index));
            });
            updateAdminSeasons();
        }

        function updateAdminSeasons() {
            const sIndex = document.getElementById('adminEpSeriesSelect').value;
            const adminEpSeason = document.getElementById('adminEpSeasonSelect');
            adminEpSeason.innerHTML = '';

            if (sIndex === '' || !db[sIndex] || !db[sIndex].seasons) return;

            db[sIndex].seasons.forEach((season, index) => {
                adminEpSeason.appendChild(new Option(season.name, index));
            });
        }

        function addSeries() {
            const name = document.getElementById('newSeriesName').value.trim();
            if (!name) return alert('Введіть назву серіалу');
            db.push({ name: name, seasons: [] });
            document.getElementById('newSeriesName').value = '';
            saveData();
            initAdminSelectors();
            alert('Серіал успішно створено!');
        }

        function addSeason() {
            const sIndex = document.getElementById('adminSeriesSelect').value;
            const name = document.getElementById('newSeasonName').value.trim();
            if (sIndex === '' || !name) return alert('Виберіть серіал та введіть назву сезону');
            db[sIndex].seasons.push({ name: name, episodes: [] });
            document.getElementById('newSeasonName').value = '';
            saveData();
            initAdminSelectors();
            alert('Сезон успішно додано!');
        }

        function addEpisode() {
            const sIndex = document.getElementById('adminEpSeriesSelect').value;
            const seaIndex = document.getElementById('adminEpSeasonSelect').value;
            const name = document.getElementById('newEpName').value.trim();
            const type = document.getElementById('newEpType').value;

            if (sIndex === '' || seaIndex === '' || !name) return alert('Заповніть назву та виберіть сезон');

            let episodeData = { name: name, type: type };

            if (type === 'interactive') {
                episodeData.content = document.getElementById('newEpContent').value.trim();
                if (!episodeData.content) return alert('Введіть інтерактивний код або текст');
            } else {
                episodeData.url = document.getElementById('newEpUrl').value.trim();
                if (!episodeData.url) return alert('Введіть посилання на YouTube');
            }
            
            db[sIndex].seasons[seaIndex].episodes.push(episodeData);
            document.getElementById('newEpName').value = '';
            document.getElementById('newEpUrl').value = '';
            document.getElementById('newEpContent').value = '';
            saveData();
            alert('Контент успішно додано!');
        }

        window.onload = function() {
            initSelectors();
        };
    </script>
</body>
</html>
