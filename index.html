<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Будівництво</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #161616;
            --accent: #ffcc00;
            --accent-hover: #e6b800;
            --text: #e0e0e0;
            --border: #333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 {
            color: var(--accent);
            margin: 0;
            text-transform: uppercase;
            font-size: 1.5rem;
        }
        .admin-square-btn {
            width: 30px;
            height: 30px;
            background-color: var(--accent);
            border: none;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        .admin-square-btn:hover {
            background-color: var(--accent-hover);
            transform: scale(1.05);
        }
        .btn {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: var(--accent-hover);
        }
        .section {
            background: var(--panel-bg);
            border-left: 4px solid var(--accent);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: var(--accent);
            font-size: 0.9rem;
        }
        select, input {
            width: 100%;
            padding: 10px;
            background: #0d0d0d;
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            box-sizing: border-box;
        }
        input[type="file"] {
            padding: 6px;
            cursor: pointer;
        }
        .player-container {
            position: relative;
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .player-container video {
            width: 100%;
            max-height: 70vh;
            border: none;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--accent);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            background: none;
            border: none;
            color: var(--accent);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .admin-form-group {
            margin-bottom: 15px;
        }
        .admin-section-title {
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .empty-notice {
            text-align: center;
            color: #777;
            padding: 40px;
        }
        #uploadStatus {
            margin-top: 10px;
            color: var(--accent);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Будівництво</h1>
        <button class="admin-square-btn" onclick="openAdminPanel()" title="Адмін-панель"></button>
    </header>

    <main>
        <div class="section">
            <div class="controls-grid">
                <div>
                    <label for="seriesSelect">Серіал:</label>
                    <select id="seriesSelect" onchange="updateSeasons()"></select>
                </div>
                <div>
                    <label for="seasonSelect">Сезон:</label>
                    <select id="seasonSelect" onchange="updateEpisodes()"></select>
                </div>
                <div>
                    <label for="episodeSelect">Серія:</label>
                    <select id="episodeSelect" onchange="playEpisode()"></select>
                </div>
            </div>

            <div id="playerWrapper">
                <div class="empty-notice" id="emptyNotice">Немає доступного контенту. Скористайтеся жовтим квадратом у верхньому кутку (пароль: 12345678)!</div>
                <div class="player-container" id="playerBox" style="display: none;">
                    <div id="videoSlot" style="width: 100%;"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Адмін-панель -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeAdminPanel()">&times;</button>
            <h2>Адмін-панель</h2>
            
            <div id="authBox">
                <div class="admin-form-group">
                    <label>Введіть пароль:</label>
                    <input type="password" id="adminPassword" placeholder="Пароль...">
                </div>
                <button class="btn" onclick="checkPassword()">Увійти</button>
            </div>

            <div id="adminPanelContent" style="display: none;">
                <div class="admin-section-title">1. Створити серіал</div>
                <div class="admin-form-group">
                    <input type="text" id="newSeriesName" placeholder="Назва серіалу...">
                </div>
                <button class="btn" onclick="addSeries()">Створити</button>

                <div class="admin-section-title">2. Додати сезон</div>
                <div class="admin-form-group">
                    <label>Виберіть серіал:</label>
                    <select id="adminSeriesSelect"></select>
                </div>
                <div class="admin-form-group">
                    <input type="text" id="newSeasonName" placeholder="Назва сезону (напр: Сезон 1)...">
                </div>
                <button class="btn" onclick="addSeason()">Додати сезон</button>

                <div class="admin-section-title">3. Додати серію з галереї</div>
                <div class="admin-form-group">
                    <label>Виберіть серіал:</label>
                    <select id="adminEpSeriesSelect" onchange="updateAdminSeasons()"></select>
                </div>
                <div class="admin-form-group">
                    <label>Виберіть сезон:</label>
                    <select id="adminEpSeasonSelect"></select>
                </div>
                <div class="admin-form-group">
                    <input type="text" id="newEpName" placeholder="Назва серії (напр: Серія 1)...">
                </div>
                <div class="admin-form-group">
                    <label>Виберіть відеофайл з пристрою:</label>
                    <input type="file" id="newEpFile" accept="video/*">
                </div>
                <button class="btn" onclick="addEpisode()">Завантажити і додати</button>
                <div id="uploadStatus"></div>
            </div>
        </div>
    </div>

    <script>
        let db = [];
        let idb = null;

        // Ініціалізація баз даних IndexedDB для збереження великих файлів
        const request = indexedDB.open("BuildingVideoDB", 1);
        request.onupgradeneeded = function(e) {
            idb = e.target.result;
            if (!idb.objectStoreNames.contains("videos")) {
                idb.createObjectStore("videos", { keyPath: "id" });
            }
        };
        request.onsuccess = function(e) {
            idb = e.target.result;
            loadStructure();
        };

        function saveStructure() {
            localStorage.setItem('building_structure_db', JSON.stringify(db));
            initSelectors();
        }

        function loadStructure() {
            db = JSON.parse(localStorage.getItem('building_structure_db')) || [];
            initSelectors();
        }

        function initSelectors() {
            const sSelect = document.getElementById('seriesSelect');
            sSelect.innerHTML = '';

            if (db.length === 0) {
                document.getElementById('emptyNotice').style.display = 'block';
                document.getElementById('playerBox').style.display = 'none';
                return;
            }

            document.getElementById('emptyNotice').style.display = 'none';
            document.getElementById('playerBox').style.display = 'block';

            db.forEach((series, sIndex) => {
                sSelect.appendChild(new Option(series.name, sIndex));
            });
            updateSeasons();
        }

        function updateSeasons() {
            const sIndex = document.getElementById('seriesSelect').value;
            const seaSelect = document.getElementById('seasonSelect');
            seaSelect.innerHTML = '';

            if (sIndex === '' || !db[sIndex] || !db[sIndex].seasons) return;

            db[sIndex].seasons.forEach((season, seaIndex) => {
                seaSelect.appendChild(new Option(season.name, seaIndex));
            });
            updateEpisodes();
        }

        function updateEpisodes() {
            const sIndex = document.getElementById('seriesSelect').value;
            const seaIndex = document.getElementById('seasonSelect').value;
            const epSelect = document.getElementById('episodeSelect');
            epSelect.innerHTML = '';

            if (sIndex === '' || seaIndex === '' || !db[sIndex].seasons[seaIndex]) return;

            db[sIndex].seasons[seaIndex].episodes.forEach((ep, epIndex) => {
                epSelect.appendChild(new Option(ep.name, epIndex));
            });
            playEpisode();
        }

        function playEpisode() {
            const sIndex = document.getElementById('seriesSelect').value;
            const seaIndex = document.getElementById('seasonSelect').value;
            const epIndex = document.getElementById('episodeSelect').value;
            const videoSlot = document.getElementById('videoSlot');

            if (sIndex === '' || seaIndex === '' || epIndex === '') {
                videoSlot.innerHTML = '';
                return;
            }

            let ep = db[sIndex].seasons[seaIndex].episodes[epIndex];
            if (!ep) return;

            // Зчитуємо відео з IndexedDB
            const tx = idb.transaction("videos", "readonly");
            const store = tx.objectStore("videos");
            const getReq = store.get(ep.videoId);

            getReq.onsuccess = function() {
                if (getReq.result) {
                    const videoUrl = URL.createObjectURL(getReq.result.file);
                    videoSlot.innerHTML = `<video src="${videoUrl}" controls autoplay style="width:100%; max-height:70vh; border-radius:4px;"></video>`;
                } else {
                    videoSlot.innerHTML = '<p style="color:red; text-align:center;">Файл відео не знайдено!</p>';
                }
            };
        }

        function openAdminPanel() {
            document.getElementById('adminModal').style.display = 'flex';
            document.getElementById('adminPassword').value = '';
            document.getElementById('authBox').style.display = 'block';
            document.getElementById('adminPanelContent').style.display = 'none';
            document.getElementById('uploadStatus').innerText = '';
        }

        function closeAdminPanel() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function checkPassword() {
            if (document.getElementById('adminPassword').value === '12345678') {
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('adminPanelContent').style.display = 'block';
                initAdminSelectors();
            } else {
                alert('Невірний пароль!');
            }
        }

        function initAdminSelectors() {
            const adminSeries = document.getElementById('adminSeriesSelect');
            const adminEpSeries = document.getElementById('adminEpSeriesSelect');
            adminSeries.innerHTML = '';
            adminEpSeries.innerHTML = '';

            if (db.length === 0) {
                adminSeries.innerHTML = '<option value="">Спершу створіть серіал</option>';
                adminEpSeries.innerHTML = '<option value="">Немає серіалів</option>';
                return;
            }

            db.forEach((series, index) => {
                adminSeries.appendChild(new Option(series.name, index));
                adminEpSeries.appendChild(new Option(series.name, index));
            });
            updateAdminSeasons();
        }

        function updateAdminSeasons() {
            const sIndex = document.getElementById('adminEpSeriesSelect').value;
            const adminEpSeason = document.getElementById('adminEpSeasonSelect');
            adminEpSeason.innerHTML = '';

            if (sIndex === '' || !db[sIndex] || !db[sIndex].seasons) return;

            db[sIndex].seasons.forEach((season, index) => {
                adminEpSeason.appendChild(new Option(season.name, index));
            });
        }

        function addSeries() {
            const name = document.getElementById('newSeriesName').value.trim();
            if (!name) return alert('Введіть назву серіалу');
            db.push({ name: name, seasons: [] });
            document.getElementById('newSeriesName').value = '';
            saveStructure();
            initAdminSelectors();
            alert('Серіал створено!');
        }

        function addSeason() {
            const sIndex = document.getElementById('adminSeriesSelect').value;
            const name = document.getElementById('newSeasonName').value.trim();
            if (sIndex === '' || !name) return alert('Заповніть поля');
            db[sIndex].seasons.push({ name: name, episodes: [] });
            document.getElementById('newSeasonName').value = '';
            saveStructure();
            initAdminSelectors();
            alert('Сезон додано!');
        }

        function addEpisode() {
            const sIndex = document.getElementById('adminEpSeriesSelect').value;
            const seaIndex = document.getElementById('adminEpSeasonSelect').value;
            const name = document.getElementById('newEpName').value.trim();
            const fileInput = document.getElementById('newEpFile');
            const status = document.getElementById('uploadStatus');

            if (sIndex === '' || seaIndex === '' || !name) return alert('Введіть назву серії');
            if (fileInput.files.length === 0) return alert('Виберіть відеофайл');

            const file = fileInput.files[0];
            const videoId = 'video_' + Date.now();

            status.innerText = "Збереження відео... Будь ласка, зачекайте.";

            // Зберігаємо файл у IndexedDB
            const tx = idb.transaction("videos", "readwrite");
            const store = tx.objectStore("videos");
            store.put({ id: videoId, file: file });

            tx.oncomplete = function() {
                db[sIndex].seasons[seaIndex].episodes.push({
                    name: name,
                    videoId: videoId
                });
                saveStructure();
                status.innerText = "";
                document.getElementById('newEpName').value = '';
                fileInput.value = '';
                alert('Серію успішно завантажено та додано на сайт!');
                closeAdminPanel();
            };

            tx.onerror = function() {
                status.innerText = "";
                alert('Помилка при збереженні відео у пам\'ять браузера!');
            };
        }
    </script>
</body>
</html>
